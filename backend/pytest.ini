[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = database/initialization
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    # Core isolation markers (most important!)
    mock: marks tests that use mocked dependencies and don't interfere with others
    real: marks tests that use real dependencies and may interfere
    
    # Performance markers
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast for quick feedback
    
    # Legacy markers
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
asyncio_mode = auto
