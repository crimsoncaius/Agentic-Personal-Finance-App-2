[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = database/initialization scripts data
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    # ============================================================================
    # DEPENDENCY MARKERS - Clear indication of what's mocked vs real
    # ============================================================================
    db_mock: marks tests that mock database operations (no real DB calls)
    db_real: marks tests that use real database connections
    llm_mock: marks tests that mock LLM/OpenAI API calls
    llm_real: marks tests that use real LLM/OpenAI API calls
    
    # ============================================================================
    # TEST TYPE MARKERS - Indicates the scope and purpose of tests
    # ============================================================================
    unit: marks isolated unit tests (typically with mocked dependencies)
    integration: marks tests that verify component interactions
    e2e: marks end-to-end tests with real dependencies
    
    # ============================================================================
    # PERFORMANCE MARKERS - For test execution time management
    # ============================================================================
    fast: marks tests as fast for quick feedback (typically < 1 second)
    slow: marks tests as slow (network calls, complex operations, > 5 seconds)
    
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
asyncio_mode = auto
